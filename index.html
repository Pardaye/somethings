  <body>
    <div class="app-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="ambient ambient-three"></div>

      <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

      <div class="message-stack" id="messageStack" aria-live="polite">
        <p class="message" data-message>I want to tell you something...</p>
        <p class="message" data-message>wait 3 second  ❤️</p>
      </div>

      <div class="tap-hint" id="tapHint">Yurakni bos</div>

      <main class="scene" aria-label="Romantik sahifa">
        <button class="heart-wrap" id="startTrigger" type="button" aria-label="Romantik animatsiyani boshlash">
          <div class="heart-glow"></div>
          <div class="heart main-heart" id="mainHeart"></div>
        </button>
      </main>

      <div class="final-container">
        <div class="final-message" id="finalMessage" aria-live="polite"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
